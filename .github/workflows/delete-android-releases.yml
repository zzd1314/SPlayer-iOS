name: Delete Android Releases

# 维护任务：删除仓库里所有 android-* 发行（含 tag）
# 仅在自身文件变化时触发，不影响正常的 Android 构建
on:
  push:
    branches: [android]
    paths:
      - '.github/workflows/delete-android-releases.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete android releases via REST API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          LOG=/tmp/cleanup.log
          : > "$LOG"

          echo '== releases ==' >> "$LOG"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$API/releases?per_page=100" -o /tmp/rels.json || true
          echo 'response head:' >> "$LOG"
          head -c 400 /tmp/rels.json >> "$LOG" || true
          echo >> "$LOG"

          python3 - <<'PY' > /tmp/pairs.txt 2>/dev/null || true
          import json
          for r in json.load(open('/tmp/rels.json')):
              if r.get('tag_name', '').startswith('android-'):
                  print(r['id'], r['tag_name'])
          PY
          cat /tmp/pairs.txt >> "$LOG"

          fail=0
          while read -r id tag; do
            [ -z "${id:-}" ] && continue
            code=$(curl -sS -o /tmp/del.out -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$API/releases/$id")
            echo "delete release $tag -> HTTP $code $(head -c 200 /tmp/del.out)" >> "$LOG"
            if [ "$code" != "204" ]; then fail=1; fi
          done < /tmp/pairs.txt

          echo '== tags ==' >> "$LOG"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$API/git/matching-refs/tags/android-" -o /tmp/tags.json || true
          python3 - <<'PY' > /tmp/refs.txt 2>/dev/null || true
          import json
          for r in json.load(open('/tmp/tags.json')):
              print(r['ref'])
          PY
          cat /tmp/refs.txt >> "$LOG"
          while read -r ref; do
            [ -z "${ref:-}" ] && continue
            code=$(curl -sS -o /tmp/rt.out -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$API/git/refs/$ref")
            echo "delete tag $ref -> HTTP $code $(head -c 200 /tmp/rt.out)" >> "$LOG"
            if [ "$code" != "204" ]; then fail=1; fi
          done < /tmp/refs.txt

          echo '== remaining ==' >> "$LOG"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$API/releases?per_page=100" -o /tmp/rels2.json || true
          python3 - <<'PY' >> "$LOG" 2>/dev/null || true
          import json
          rels = json.load(open('/tmp/rels2.json'))
          print('remaining:', [r['tag_name'] for r in rels if r['tag_name'].startswith('android-')])
          PY

          cat "$LOG"
          if [ "$fail" != "0" ]; then
            gh issue create --title '清理 Android Release 失败（诊断日志）' \
              --body-file "$LOG" || true
            exit 1
          fi
