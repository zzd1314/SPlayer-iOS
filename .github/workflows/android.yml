name: Android CI

on:
  push:
    branches: [ android ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager)
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 关键：开启 pipefail，避免 tee 掩盖 Gradle 的真实失败
      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Collect build info
        if: always()
        run: |
          {
            echo ""
            echo "=== gradle version ==="
            gradle --version 2>&1 | head -n 12 || true
            echo "=== apk files ==="
            find . -name "*.apk" -print 2>/dev/null || true
            echo "=== build outputs tree ==="
            ls -R android/app/build/outputs 2>/dev/null || true
            echo "=== android/app/build top ==="
            ls android/app/build 2>/dev/null || true
          } >> build.log 2>&1 || true
          echo "log lines: $(wc -l < build.log)"

      # 把完整构建日志推到 ci-logs 分支，便于匿名查看排错
      - name: Publish build log to ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build.log ci-build.log
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B ci-logs
          git add -f ci-build.log
          git commit -m "ci: build log for ${GITHUB_SHA}" || true
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splayer-next-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=android-v0.4.0
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "未找到 APK，终止发布"
            exit 1
          fi
          cp "$APK" splayer-next-android-v0.4.0-debug.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" splayer-next-android-v0.4.0-debug.apk --clobber
          else
            gh release create "$TAG" splayer-next-android-v0.4.0-debug.apk \
              --target "$GITHUB_SHA" \
              --title "SPlayer Next Android v0.4.0" \
              --notes "SPlayer Next 安卓端 v0.4.0（Debug APK）：新增歌曲评论页（精彩评论 / 最新评论）、歌手详情页（热门单曲 + 专辑列表）、专辑详情页（简介与曲目）、MV 精选列表与在线视频播放（Media3 PlayerView）、离线下载管理（下载 / 离线播放 / 删除）、播放页一键进入评论与专辑。延续 v0.3.0 的主题系统、全屏播放、设置中心、Cookie 登录与本地音乐。"
          fi