name: Android CI

on:
  push:
    branches: [ android ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager)
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: splayer-next-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=android-v0.3.0
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n1)
          cp "$APK" splayer-next-android-v0.3.0-debug.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" splayer-next-android-v0.3.0-debug.apk --clobber
          else
            gh release create "$TAG" splayer-next-android-v0.3.0-debug.apk \
              --target "$GITHUB_SHA" \
              --title "SPlayer Next Android v0.3.0" \
              --notes "SPlayer Next 安卓端 v0.3.0（Debug APK）：全新主题系统（浅色/深色/跟随系统、默认/封面取色/自定义主色、液态玻璃与经典两套界面）、首页/发现/资料库/搜索/我的/歌单详情、全屏播放页（经典/全封面/全歌词三布局、队列、倍速、睡眠定时、音量、LRC 双语歌词）、设置中心与 Cookie 登录、本地音乐扫描。"
          fi
