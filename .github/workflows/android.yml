name: Android Build

on:
  push:
    branches: [android]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch upstream SPlayer-Next source
        run: git clone --depth 1 https://github.com/SPlayer-Dev/SPlayer-Next splayer-next-src

      - name: Install upstream dependencies
        working-directory: splayer-next-src
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm install -g pnpm@12
          pnpm install --ignore-scripts

      - name: Build original renderer (Vue frontend)
        working-directory: splayer-next-src
        run: pnpm exec electron-vite build

      - name: Copy renderer output into Android assets
        run: |
          mkdir -p android/webview/src/main/assets/web
          cp -r splayer-next-src/out/renderer/* android/webview/src/main/assets/web/

      - name: Build netease API bridge bundle
        working-directory: splayer-next-src
        run: |
          cp -r "$GITHUB_WORKSPACE/android-bridge" .
          cd android-bridge
          npm install --no-audit --no-fund
          npx esbuild src/entry.ts --bundle --platform=browser --format=iife \
            --global-name=NeteaseBridge \
            --outfile="$GITHUB_WORKSPACE/android/webview/src/main/assets/web/netease-api.js" \
            --inject:./src/shim.cjs \
            --define:global=globalThis \
            "--define:process.env.NODE_ENV=\"production\"" \
            --alias:@main=../electron/main \
            --alias:@main/utils/proxy=./src/stubs/proxy.ts \
            --alias:@main/utils/logger=./src/stubs/logger.ts \
            --alias:@main/store=./src/stubs/store.ts \
            --alias:@main/database=./src/stubs/database.ts \
            --alias:electron=./src/stubs/electron.ts \
            --alias:@main/window/main=./src/stubs/windowmain.ts \
            --alias:node:crypto=crypto-browserify \
            --alias:node:os=./src/stubs/os.ts \
            --alias:node:zlib=./src/stubs/zlib.ts \
            --alias:stream=readable-stream \
            --alias:path=path-browserify \
            --alias:util=util \
            --tsconfig=tsconfig.json \
            --log-level=warning

      - name: Build debug APK
        run: gradle -p android :webview:assembleDebug --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=android-v1.0.0
          APK=$(find android/webview/build/outputs/apk/debug -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "未找到 APK，终止发布"
            exit 1
          fi
          cp "$APK" splayer-next-android-v1.0.0-web-debug.apk
          {
            echo 'SPlayer Next Android v1.0.0 —— 基于上游 SPlayer-Next 原版 Vue 前端的 WebView 移植：'
            echo ''
            echo '**移植方式**'
            echo '- 原版渲染层（Vue 3 + Pinia + UnoCSS）在 CI 中从上游源码实时构建，UI 与桌面版 1:1。'
            echo '- 网易云 API 加密层（eapi / xeapi）直接复用上游主进程 TS 模块，在 WebView 内运行，请求经原生 HTTP 代理转发。'
            echo '- 播放内核使用 Media3（ExoPlayer）承接原 Rust audio-engine 的播放契约，支持 mp3 / flac / ogg / aac / wav 在线与本地流播放。'
            echo '- MediaSession 前台服务：锁屏 / 通知栏 / 蓝牙控制、后台播放、音频焦点管理。'
            echo ''
            echo '**已知限制（后续版本迭代）**'
            echo '- 本地音乐扫描、下载管理器、流媒体服务器（Subsonic/Jellyfin/Emby）暂未接入本版，将在后续版本补齐。'
            echo '- 实时 FFT 频谱暂不可用（Media3 可视化数据待接入）。'
            echo '- APE 等极少见格式依赖 FFmpeg 扩展，暂不支持。'
            echo ''
            echo '安装包约 9MB，需要 Android 8.0（API 26）及以上。'
          } > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" splayer-next-android-v1.0.0-web-debug.apk --clobber
          else
            gh release create "$TAG" splayer-next-android-v1.0.0-web-debug.apk \
              --target "$GITHUB_SHA" \
              --title "SPlayer Next Android v1.0.0（原版 UI 移植版）" \
              --notes-file release-notes.md
          fi