name: Android Build

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch upstream SPlayer-Next source
        run: |
          # 锁定经过验证的上游 commit，保证构建可复现
          git clone --depth 1 https://github.com/SPlayer-Dev/SPlayer-Next splayer-next-src
          git -C splayer-next-src fetch --depth 1 origin 5772455c88c88983800d14d1011c84aa08fbd1e8
          git -C splayer-next-src checkout 5772455c88c88983800d14d1011c84aa08fbd1e8
          git -C splayer-next-src rev-parse HEAD

      - name: Install upstream dependencies
        working-directory: splayer-next-src
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm install -g pnpm@12
          pnpm install --ignore-scripts

      - name: Build original renderer (Vue frontend)
        working-directory: splayer-next-src
        run: pnpm exec electron-vite build

      - name: Copy renderer output into Android assets
        run: |
          mkdir -p android/webview/src/main/assets/web
          cp -r splayer-next-src/out/renderer/* android/webview/src/main/assets/web/

      - name: Build netease API bridge bundle
        working-directory: splayer-next-src
        run: |
          cp -r "$GITHUB_WORKSPACE/android-bridge" .
          cd android-bridge
          npm install --no-audit --no-fund
          npx esbuild src/entry.ts --bundle --platform=browser --format=iife \
            --global-name=NeteaseBridge \
            --outfile="$GITHUB_WORKSPACE/android/webview/src/main/assets/web/netease-api.js" \
            --inject:./src/shim.cjs \
            --define:global=globalThis \
            "--define:process.env.NODE_ENV=\"production\"" \
            --alias:@main=../electron/main \
            --alias:@main/utils/proxy=./src/stubs/proxy.ts \
            --alias:@main/utils/logger=./src/stubs/logger.ts \
            --alias:@main/store=./src/stubs/store.ts \
            --alias:@main/database=./src/stubs/database.ts \
            --alias:electron=./src/stubs/electron.ts \
            --alias:@main/window/main=./src/stubs/windowmain.ts \
            --alias:node:crypto=crypto-browserify \
            --alias:node:os=./src/stubs/os.ts \
            --alias:node:zlib=./src/stubs/zlib.ts \
            --alias:stream=readable-stream \
            --alias:path=path-browserify \
            --alias:util=util \
            --tsconfig=tsconfig.json \
            --log-level=warning

      - name: Build streaming API bundle (reuse upstream TS services)
        working-directory: splayer-next-src
        run: |
          # 复用上游主进程 streaming 服务层（Subsonic/Jellyfin adapters）
          node android-bridge/build-streaming.mjs \
            "$GITHUB_WORKSPACE/android/webview/src/main/assets/web/streaming-api.js"

      - name: Set up Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install libclang (bindgen requirement)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Build Rust audio core (ffmpeg_audio → arm64-v8a)
        id: rustcore
        continue-on-error: true
        run: |
          set +e
          bash tools/rust-android-test/ci-build.sh android/webview/src/main/jniLibs/arm64-v8a > rust-build.log 2>&1
          code=$?
          tail -n 100 rust-build.log
          exit $code

      - name: Report Rust build failure (diagnostics issue)
        if: steps.rustcore.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "主发布流程 Rust ARM64 构建失败（commit $GITHUB_SHA），日志尾部："
            echo '```'
            tail -n 200 rust-build.log 2>/dev/null || echo "(日志文件缺失)"
            echo '```'
            echo ''
          } > diag.md
          ISSUE=$(gh issue list --state open --search "CI 诊断：Rust ARM64 构建 in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$ISSUE" ]; then
            gh issue create --title "CI 诊断：Rust ARM64 构建" --body-file diag.md
          else
            gh issue comment "$ISSUE" --body-file diag.md
          fi

      - name: Ensure Rust core packaged
        run: test -f android/webview/src/main/jniLibs/arm64-v8a/librust_android_test.so

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/webview/splayer-debug.jks
          elif [ -f android/webview/splayer-debug.jks.b64 ]; then
            base64 -d android/webview/splayer-debug.jks.b64 > android/webview/splayer-debug.jks
          else
            echo "::warning::未提供签名 keystore，构建产物将使用默认调试签名"
          fi

      - name: Build debug APK
        run: gradle -p android :webview:assembleDebug --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 版本号统一从 build.gradle.kts 读取，避免每次发版都要改工作流
          VERSION=$(grep -oP 'appVersionName\s*=\s*"\K[^"]+' android/webview/build.gradle.kts | head -n1)
          if [ -z "$VERSION" ]; then
            echo "未能从 build.gradle.kts 读取 versionName，终止发布"
            exit 1
          fi
          TAG="android-v$VERSION"
          APK_NAME="splayer-next-android-v$VERSION-web-debug.apk"
          APK=$(find android/webview/build/outputs/apk/debug -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "未找到 APK，终止发布"
            exit 1
          fi
          cp "$APK" "$APK_NAME"
          {
            echo "SPlayer Next Android v$VERSION —— 基于上游 SPlayer-Next 原版 Vue 前端的 WebView 移植："
            echo ''
            echo '**v1.1.6 修复（扫码登录二维码空白 / 设置弹窗排版错乱）**'
            echo '- 二维码空白根因：网易云 API bundle 加载时调用了 Electron 桩上不存在的 app.once("before-quit")，导致 netease-api.js 整体加载即抛 TypeError，所有在线接口（含 login_qr_key）不可用。已为桩补上 once/on/off。'
            echo '- 第二个根因：bridge.js 从 window.NeteaseBridge 取模块，但 bundle 以 dynamic import 加载时该变量只存在于模块作用域，实际入口是 globalThis.__Netease。已改为读取 __Netease，并在缺失时给出明确错误。'
            echo '- 设置弹窗排版：上游左栏固定 280px，手机宽度下把右侧内容挤成竖排；新增仅在 ≤720px 生效的样式，把左栏收窄到 148px 并压缩内边距。'
            echo '- HTTP 代理：网易云请求显式带 Accept-Encoding: gzip,deflate 时，原生 HttpURLConnection 不会自动解压，已补上 gzip/deflate 解压与 Content-Type 保留。'
            echo ''
            echo '**v1.1.5 修复（真机启动仍停诊断面板）**'
            echo '- 根因：桥接调用跑在 Dispatchers.IO 协程（DefaultDispatcher-worker）上，而 Media3 ExoPlayer 强制要求主线程访问，initPlayer() 中首次读取播放器状态就抛 Player is accessed on the wrong thread，启动流程中断。'
            echo '- 修复：window.api.player.* 全部调用统一切到主线程同步执行（含 getStatus / getVolume 等读取），并加 10s 超时保护。'
            echo ''
            echo '**v1.1.4 修复**'
            echo '- 根因：桥接层把 callId 直接拼进注入脚本且未加引号，实际执行成 window.__splayerResolve(c1, ...) 并抛 ReferenceError；每个调用都不回结果，导致 window.api.window.ready() 永不 resolve、启动层卡死，且错误被 WebView 统一报成 Script error.。'
            echo '- 修复：callId / 事件 channel 统一用 JSONObject.quote 转义为合法 JS 字符串字面量。'
            echo ''
            echo '**v1.1.3 修复**'
            echo '- 固定签名密钥，后续版本可直接覆盖安装，不再出现“已安装了签名冲突的应用”。'
            echo '- 启用官方 SPlayer 标志的自适应图标，替换系统默认安卓机器人图标。'
            echo '- 启动诊断面板升级：错误带文件名/行号、相同错误合并计数、并检查各脚本加载状态；渲染层 console 同步到 logcat（标签 SPlayerWeb）。'
            echo ''
            echo '**v1.1.2 修复**'
            echo '- 补齐 window.* 与 plugins.* 桥接，修复启动首句 window.api.window.ready() 被拒绝的问题。'
            echo ''
            echo '**早期版本**：v1.1.1 接入 Rust/FFmpeg 音频核心动态库；v1.1.0 接入流媒体、本地音乐库、下载管理、播放列表、实时频谱。'
            echo ''
            echo '**已知限制**'
            echo '- Rust audio-engine 完整解码/输出链路尚未接入，当前播放内核为 Media3；APE 等冷门格式暂不支持。'
            echo '- 本地音乐标签写入、下载标签嵌入暂未实现（仅写入同名 .lrc 歌词）。'
            echo '- 未进行规模化真机/模拟器验证，真机结论以实际复测为准。'
            echo ''
            echo '安装包需要 Android 8.0（API 26）及以上，当前仅提供 arm64-v8a。'
          } > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
          else
            gh release create "$TAG" "$APK_NAME" \
              --target "$GITHUB_SHA" \
              --title "SPlayer Next Android v$VERSION" \
              --notes-file release-notes.md
          fi
