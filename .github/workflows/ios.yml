name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Restore app icon
        run: |
          python3 -c "import base64,re,sys; open(sys.argv[2],'wb').write(base64.b64decode(re.sub(rb'\s+',b'',open(sys.argv[1],'rb').read())))" ci/icon.b64 /tmp/logo-icon-1024x1024.png
          # 去除 alpha 通道，避免 actool 对图标 alpha 的构建问题
          sips -s format jpeg /tmp/logo-icon-1024x1024.png --out /tmp/icon-flat.jpg >/dev/null
          sips -s format png /tmp/icon-flat.jpg --out "Sources/Resources/Assets.xcassets/AppIcon.appiconset/logo-icon-1024x1024.png" >/dev/null

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Rust API library
        run: |
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          set -o pipefail
          PLATFORM_NAME=iphoneos ARCHS=arm64 bash rust/build-ios.sh 2>&1 | tee rust-build.log

      - name: Build unsigned IPA
        run: |
          set -o pipefail
          xcodebuild \
            -project SPlayer-iOS.xcodeproj \
            -scheme SPlayer-iOS \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log | tail -30

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/DerivedData/Build/Products/Release-iphoneos/SPlayer-iOS.app" Payload/
          zip -qry SPlayer-iOS-unsigned.ipa Payload

      - name: Verify IPA structure
        run: |
          set -euo pipefail
          APP_PATH=$(unzip -Z1 SPlayer-iOS-unsigned.ipa | grep -E '^Payload/[^/]+\.app/$' | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "未在 Payload 下找到 .app 目录" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! unzip -Z1 SPlayer-iOS-unsigned.ipa | grep -qx "${APP_PATH}Info.plist"; then
            echo "缺少 ${APP_PATH}Info.plist" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "## 安装包结构校验"
            echo '```'
            unzip -l SPlayer-iOS-unsigned.ipa | head -25
            echo '```'
            echo "- App bundle: \`${APP_PATH}\`"
            echo "- Info.plist: OK"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-iOS-unsigned-ipa
          path: SPlayer-iOS-unsigned.ipa
          retention-days: 30

      - name: Show build error
        if: failure()
        run: |
          set -euo pipefail
          for f in rust-build.log build.log; do
            if [ -f "$f" ]; then
              echo "## ${f} 末尾输出" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -80 "$f" >> "$GITHUB_STEP_SUMMARY" || true
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            rust-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*MARKETING_VERSION: *"\([0-9][0-9.]*\)".*/\1/p' project.yml | head -1)
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "SPlayer-Next iOS ${TAG}" \
              --notes "自动构建，提交 ${GITHUB_SHA}" \
              --latest
          fi
          gh release upload "$TAG" SPlayer-iOS-unsigned.ipa --clobber
