name: SPlayer-iOS

options:
  bundleIdPrefix: com.splayer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  SPlayer-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - Resources/Info.plist
          - Widget
          - Widget/**
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.splayer.ios
        INFOPLIST_FILE: Sources/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/SPlayer-iOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        # Rust 内置 API 静态库
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/rust/out/$(PLATFORM_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -lncm_api_ios
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Config/NcmAPI-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/rust/include
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    preBuildScripts:
      - name: "构建 Rust 内置 API 静态库"
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          bash "$SRCROOT/rust/build-ios.sh"
    dependencies:
      - target: SPlayerWidgets
        embed: true

  SPlayerWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Widget
        excludes:
          - Resources/Info.plist
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.splayer.ios.widget
        PRODUCT_NAME: SPlayerWidgets
        INFOPLIST_FILE: Sources/Widget/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/SPlayerWidgets.entitlements
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"

schemes:
  SPlayer-iOS:
    build:
      targets:
        SPlayer-iOS: all
    run:
      config: Debug
